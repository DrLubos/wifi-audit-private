# wifi-audit server stack: db (PostgreSQL) + api (FastAPI) + frontend (Caddy + React).
#
#   cp .env.example .env            # credentials and the public address, gitignored
#   docker compose build frontend && docker compose build api
#   docker compose up -d
#
# Only the frontend publishes ports (80/443). The database is reachable solely on
# the `backend` network; the internet-facing Caddy container is not on it.

name: wifi-audit

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sized for a 1 GB box. Plain PostgreSQL, no extensions.
    # The log_* flags are diagnostic logging for the crash-restarts ("server
    # process exited with exit code 2", nothing logged before it; 2026-10-14,
    # 10-16, 10-17 x2 - docs/postgres-crashes.md): every connection with its
    # PID, client address and application, so a crashed PID can be traced.
    # Reversible: drop the flags and `docker compose up -d db`.
    command: >-
      postgres -c shared_buffers=128MB -c work_mem=8MB -c max_connections=20
      -c log_line_prefix='%m [%p] %q%u@%d %a %r '
      -c log_connections=on -c log_disconnections=on
      -c log_error_verbosity=verbose
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first initialised. To re-apply the
      # (idempotent) file later: see README.md.
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s               # each probe is a docker exec: CPU the e2-micro's budget pays for
      timeout: 5s
      retries: 12
    # Time for the shutdown checkpoint before SIGKILL (default 10 s): a killed
    # postgres recovers from WAL on the next start and loses its statistics
    # counters (pg_stat_*), as after the crash recoveries of 2026-09-27.
    stop_grace_period: 60s
    networks:
      - backend
    logging: *logging

  api:
    build: ./api
    restart: unless-stopped
    environment:
      # One secret, one place: derived from the values above unless .env sets
      # DATABASE_URL explicitly (needed if the password contains @ : / %).
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
      # dashboard v2 writes (Settings, labels, classification): the bearer token
      # of every write endpoint; empty or unset = writes disabled (403)
      WRITE_TOKEN: "${WRITE_TOKEN:-}"
      # sensor ingest (/api/ingest/v1, docs/live-upload.md): per-sensor tokens
      # in the database (ops/sensor_token.sh); 0 = every ingest route 503, the
      # sensors keep their data and retry
      INGEST_ENABLED: "${INGEST_ENABLED:-1}"
    depends_on:
      db:
        condition: service_healthy
    # /api/health also drops the pool's dead connections after a DB restart
    # (app/db.py). Every probe starts a python (bytecode precompiled in the image).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - frontend
    logging: *logging

  # Dashboard rollups after live ingest (docs/live-upload.md 6.4): the api
  # image, `python -m app.refresher`. Refreshes the sensors the ingest marked
  # dirty, the contact periods, and the RSSI baselines nightly; the next round
  # waits max(REFRESH_INTERVAL_S, 4 x the last round) - at most a fifth of the
  # core. Built with the api (`docker compose build api`).
  refresher:
    image: wifi-audit-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
      REFRESH_INTERVAL_S: "${REFRESH_INTERVAL_S:-60}"
    entrypoint: ["python", "-m", "app.refresher"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *logging

  # On-demand batch detectors (server/detection/). Behind a profile, so
  # `docker compose up` never starts it; it reuses the built api image (psycopg)
  # and bind-mounts the package, so a code change needs no rebuild:
  #   docker compose run --rm detect deauth-flood --from 2026-09-15 --to 2026-09-21 --dry-run
  detect:
    image: wifi-audit-api
    profiles: ["tools"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
    volumes:
      - ./detection:/app/detection:ro
    working_dir: /app
    entrypoint: ["python", "-m", "detection"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *logging

  # Staged-attack evaluation harness (read-only on the DB). Reads the detections
  # a `detect` run wrote plus a ground-truth CSV under ./docs, and writes the
  # report + CSV back to ./docs (the only writable mount). Same tools profile;
  # never started by `up`. Reuses detection/common, so both are mounted.
  #   docker compose run --rm evaluate report --groundtruth docs/groundtruth.enriched.csv \
  #       --sensor pi-fri --from 2026-09-24 --to 2026-09-25 --out docs/evaluation.md
  evaluate:
    image: wifi-audit-api
    profiles: ["tools"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
    volumes:
      - ./detection:/app/detection:ro
      - ./evaluation:/app/evaluation:ro
      - ./docs:/app/docs
    working_dir: /app
    entrypoint: ["python", "-m", "evaluation"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # A domain name = automatic HTTPS (DNS must point here, 80/443 reachable);
      # ':80' = plain HTTP; 'localhost' = Caddy's internal CA.
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind-mounted so a config edit is `docker compose exec frontend caddy reload
      # --config /etc/caddy/Caddyfile`, not an image rebuild.
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    networks:
      - frontend
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  backend:
  frontend:
